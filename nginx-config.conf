# Configuración de Nginx para el Servicio Decodificador CV
# Subdominio: api.luminatalentgroup.com
# Puerto del servicio Python: 8001

server {
    listen 80;
    server_name api.luminatalentgroup.com;
    
    # Redirigir HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.luminatalentgroup.com;
    
    # Configuración SSL (ajustar rutas según tu configuración)
    ssl_certificate /etc/letsencrypt/live/api.luminatalentgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.luminatalentgroup.com/privkey.pem;
    
    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Headers de seguridad
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Configuración de logs
    access_log /var/log/nginx/api.luminatalentgroup.com.access.log;
    error_log /var/log/nginx/api.luminatalentgroup.com.error.log;
    
    # Configuración de proxy para el servicio Python
    location / {
        proxy_pass http://localhost:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Configuración específica para la documentación de la API
    location /docs {
        proxy_pass http://localhost:8001/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /redoc {
        proxy_pass http://localhost:8001/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Configuración para health check
    location /health {
        proxy_pass http://localhost:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache para health checks
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10s;
    }
    
    # Configuración para endpoints de CV
    location /api/cv/ {
        proxy_pass http://localhost:8001/api/cv/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts más largos para procesamiento de CVs
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffer settings para archivos grandes
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_max_temp_file_size 0;
    }
    
    # Configuración para archivos estáticos (si los hay)
    location /static/ {
        alias /var/www/api.luminatalentgroup.com/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Configuración para favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    
    # Configuración para robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
    
    # Configuración de seguridad adicional
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Configuración para archivos de configuración
    location ~* \.(env|config|ini|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Configuración para manejo de errores
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    
    # Redirigir todo el tráfico no reconocido al dominio principal
    return 301 https://luminatalentgroup.com$request_uri;
} 